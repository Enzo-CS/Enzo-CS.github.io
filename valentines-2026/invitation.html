<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Valentine 💖</title>

        <link href="https://fonts.googleapis.com/css2?family=La+Belle+Aurore&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
        
        <script src="https://cdn.tailwindcss.com"></script>
        
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            'custom-pink': '#edc4c8',
                            'custom-red': '#ba2332',
                        },
                    },
                },
            }
        </script>

        <style>
            .romantic-font { font-family: 'La Belle Aurore', cursive; }
            .polaroid-font { font-family: 'Patrick Hand', cursive; }

            .yes-pulse {
                animation: heartbeat 0.6s ease-in-out;
                box-shadow: 0 0 25px rgba(186, 35, 50, 0.6);
            }

            .polaroid {
                background: white;
                padding: 18px 18px 36px;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
                border-radius: 4px;
                width: 375px; 
                cursor: grab;
                user-select: none;
                touch-action: none;
                position: absolute;
            }
            .polaroid-transition {
                transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            }
            .polaroid img { width: 100%; aspect-ratio: 1/1; object-fit: cover; pointer-events: none; }

            .invitation-box {
                position: relative;
                overflow: visible;
                background: white;
                border-radius: 50px;
                padding: 60px;
                box-shadow: 0 30px 60px rgba(0,0,0,0.15);
                max-width: 95%;
                width: 650px;
                min-height: 400px;
                text-align: center;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            .heart-particle {
                position: absolute; font-size: 24px; pointer-events: none; z-index: 100;
                animation: floatUp 0.8s ease-out forwards;
            }
            @keyframes floatUp {
                from { transform: translateY(0) scale(1); opacity: 1; }
                to { transform: translateY(-100px) scale(1.5); opacity: 0; }
            }
        </style>
    </head>

    <body class="bg-custom-pink overflow-hidden w-full h-screen">

        <div id="dialogueScreen" class="fixed inset-0 flex items-center justify-center z-[100] transition-opacity duration-1000">
            <p id="dialogueText" class="romantic-font text-custom-red text-6xl md:text-8xl font-bold opacity-0 transition-opacity duration-[1500ms] text-center px-4"></p>
        </div>

        <div id="polaroidStack" class="fixed inset-0 flex items-center justify-center opacity-0 z-40 pointer-events-none transition-opacity duration-1000">
            <div class="relative w-[400px] h-[500px] flex items-center justify-center">
                <div class="polaroid swipeable rotate-[4deg] z-[10]">
                    <img src="./images/5.JPEG" /><p class="polaroid-font text-center mt-3 text-gray-700 text-2xl">ror 🦖</p>
                </div>
                <div class="polaroid swipeable rotate-[-6deg] z-[20]">
                    <img src="./images/4.jpg" /><p class="polaroid-font text-center mt-3 text-gray-700 text-2xl">bleh 😛😛</p>
                </div>
                <div class="polaroid swipeable rotate-[9deg] z-[30]">
                    <img src="./images/3.JPEG" /><p class="polaroid-font text-center mt-3 text-gray-700 text-2xl">funny 😭</p>
                </div>
                <div class="polaroid swipeable rotate-[-11deg] z-[40]">
                    <img src="./images/2.JPEG" /><p class="polaroid-font text-center mt-3 text-gray-700 text-2xl">goofy ahhh</p>
                </div>
                <div class="polaroid swipeable rotate-[6deg] z-[50]">
                    <img src="./images/1.JPEG" /><p class="polaroid-font text-center mt-3 text-gray-700 text-2xl">what u lookin at</p>
                </div>
            </div>
        </div>

        <div id="finalSection" class="fixed inset-0 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-1000 z-50">
            <div class="invitation-box">
                <h2 class="romantic-font text-custom-red text-6xl md:text-7xl mt-6 font-bold text-center">
                    <span class="block font-extrabold text-[1.0em] mb-2 leading-tight">
                        will you be my
                    </span>
                    <div class="h-9"></div>
                    <span class="block font-extrabold text-[1.7em] leading-none">
                        Valentine?
                    </span>
                </h2>

                <div class="flex flex-col sm:flex-row gap-10 w-full justify-center items-center mt-6 min-h-[120px]">
                    <button id="yesButton" onclick="handleYes()" class="bg-custom-red text-white px-16 py-4 rounded-full text-4xl romantic-font shadow-xl hover:scale-110 transition-transform active:scale-95 z-[60]">
                        Yes!
                    </button>

                    <button
                        id="noButton"
                        onmouseenter="moveNoButton()"
                        onclick="moveNoButton()"
                        class="border-4 border-custom-red text-custom-red px-16 py-4 rounded-full text-4xl romantic-font transition-transform duration-200 z-[60]"
                    >   
                        No
                    </button>

                </div>

                <div id="successMessage" class="mt-10 opacity-0 transition-opacity duration-1000">
                    <p class="romantic-font text-custom-red text-4xl">YEY! message me hihi <3</p>
                </div>
            </div>
        </div>

        <script>
            let index = 0;
            const lines = [
                "to my baby, my everything-",
                "atheena-"
            ];
            let cardsLeft = document.querySelectorAll(".swipeable").length;

            // AUDIO SETUP
            const audio = new Audio('./audio/valentine.mp3');
            audio.loop = true;
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaElementSource(audio);
            const gainNode = audioCtx.createGain();
            gainNode.gain.value = 2;
            source.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            // -------------------
            // DIALOGUE FUNCTION
            // -------------------
            function showLine() {
                const text = document.getElementById("dialogueText");
                const screen = document.getElementById("dialogueScreen");

                if (index === 0) {
                    audioCtx.resume().catch(() => {});
                    audio.play().catch(() => {});
                }

                if (index >= lines.length) {
                    screen.classList.add("opacity-0");
                    setTimeout(() => {
                        screen.classList.add("hidden");
                        startPart2();
                    }, 1000);
                    return;
                }

                text.textContent = lines[index];
                text.classList.remove("opacity-0");
                text.classList.add("opacity-100");

                setTimeout(() => {
                    text.classList.remove("opacity-100");
                    text.classList.add("opacity-0");
                    index++;
                    setTimeout(showLine, 1000);
                }, 3000);
            }

            // -------------------
            // POLAROID STACK
            // -------------------
            function startPart2() {
                const stack = document.getElementById("polaroidStack");
                stack.classList.remove("opacity-0", "pointer-events-none");
                stack.classList.add("opacity-100");
            }

            let activeCard = null, startX = 0, startY = 0, currentX = 0, currentY = 0;

            document.querySelectorAll(".swipeable").forEach(card => {
                card.addEventListener("pointerdown", e => {
                    activeCard = e.currentTarget;
                    activeCard.classList.remove("polaroid-transition");
                    startX = e.clientX; startY = e.clientY;
                    activeCard.setPointerCapture(e.pointerId);
                });
            });

            window.addEventListener("pointermove", e => {
                if (!activeCard) return;
                currentX = e.clientX - startX;
                currentY = e.clientY - startY;
                activeCard.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${currentX * 0.1}deg)`;
                if (Math.random() > 0.9) spawnHeart(e.clientX, e.clientY);
            });

            window.addEventListener("pointerup", e => {
                if (!activeCard) return;
                activeCard.releasePointerCapture(e.pointerId);
                activeCard.classList.add("polaroid-transition");

                if (Math.abs(currentX) > 150) {
                    const dir = currentX > 0 ? 1 : -1;
                    activeCard.style.transform = `translate(${dir * 1200}px, ${currentY}px) rotate(${dir * 60}deg)`;
                    activeCard.style.opacity = "0";
                    const toRemove = activeCard;
                    setTimeout(() => { 
                        toRemove.remove(); 
                        cardsLeft--;
                        if (cardsLeft === 0) startPart3();
                    }, 500);
                } else { activeCard.style.transform = ""; }
                activeCard = null; currentX = 0; currentY = 0;
            });

            // -------------------
            // FINAL VALENTINE
            // -------------------
            function startPart3() {
                document.getElementById("polaroidStack").classList.add("hidden");
                const section = document.getElementById("finalSection");
                section.classList.remove("pointer-events-none");
                section.classList.add("opacity-100");
            }

            function moveNoButton() {
                const noBtn = document.getElementById("noButton");
                const yesBtn = document.getElementById("yesButton");
                const box = document.querySelector(".invitation-box");

                noBtn.style.position = "fixed";

                const padding = 20;
                const btnRect = noBtn.getBoundingClientRect();
                const boxRect = box.getBoundingClientRect();

                let x, y;
                let safe = false;

                while (!safe) {
                    x = Math.random() * (window.innerWidth - btnRect.width - padding * 2) + padding;
                    y = Math.random() * (window.innerHeight - btnRect.height - padding * 2) + padding;

                    const overlapX = x + btnRect.width > boxRect.left && x < boxRect.right;
                    const overlapY = y + btnRect.height > boxRect.top && y < boxRect.bottom;

                    if (!(overlapX && overlapY)) safe = true;
                }

                noBtn.style.left = `${x}px`;
                noBtn.style.top = `${y}px`;

                yesBtn.classList.remove("yes-pulse");
                void yesBtn.offsetWidth; 
                yesBtn.classList.add("yes-pulse");
            }

            function handleYes() {
                document.getElementById("successMessage").classList.replace("opacity-0", "opacity-100");
                document.getElementById("noButton").classList.add("hidden");

                for (let i = 0; i < 80; i++) {
                    setTimeout(() => spawnHeart(Math.random() * window.innerWidth, Math.random() * window.innerHeight), i * 40);
                }
            }

            function spawnHeart(x, y) {
                const hearts = ["💖", "💕", "💘", "💝", "❤️", "💗"];
                for (let i = 0; i < 2; i++) {
                    const heart = document.createElement("div");
                    heart.className = "heart-particle";
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];

                    const offsetX = (Math.random() - 0.5) * 30;
                    const offsetY = (Math.random() - 0.5) * 30;
                    const size = 20 + Math.random() * 20;
                    const rotation = (Math.random() - 0.5) * 60;

                    heart.style.left = x + offsetX + "px";
                    heart.style.top = y + offsetY + "px";
                    heart.style.fontSize = size + "px";
                    heart.style.transform = `rotate(${rotation}deg)`;

                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 800);
                }
            }

            let lastHeartTime = 0;
            window.addEventListener("mousemove", (e) => {
                const now = Date.now();
                if (now - lastHeartTime > 80) {
                    spawnHeart(e.clientX, e.clientY);
                    lastHeartTime = now;
                }
            });

            // -------------------
            // AUTO-START EVERYTHING
            // -------------------
            window.addEventListener('DOMContentLoaded', () => {
                showLine(); // start dialogue immediately

                audioCtx.resume().then(() => {
                    audio.play().catch(() => {
                        // in case autoplay blocked, will start on first click
                        document.body.addEventListener('click', () => audio.play(), { once: true });
                    });
                });
            });

            window.addEventListener('DOMContentLoaded', () => {
                
            showLine();

            audioCtx.resume().then(() => {
                audio.play().catch(() => {
                    const overlay = document.createElement('div');
                    overlay.id = "audioOverlay";
                    overlay.textContent = "Tap anywhere to start 🎵";
                    overlay.style.cssText = `
                        position: fixed;
                        inset: 0;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        background: rgba(0,0,0,0.4);
                        color: white;
                        font-size: 2em;
                        z-index: 9999;
                        cursor: pointer;
                    `;
                    document.body.appendChild(overlay);

                    overlay.addEventListener('click', () => {
                        audio.play();
                        audioCtx.resume();
                        overlay.remove();
                    }, { once: true });
                });
            });
        });

        </script>


    </body>
</html>
