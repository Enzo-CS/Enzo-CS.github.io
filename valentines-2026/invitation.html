<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Valentine 💖</title>

        <link href="https://fonts.googleapis.com/css2?family=La+Belle+Aurore&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com" rel="stylesheet">
        <script src="https://cdn.tailwindcss.com"></script>
        
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            'custom-pink': '#edc4c8',
                            'custom-red': '#ba2332',
                        },
                    },
                },
            }
        </script>

        <style>
            .romantic-font { font-family: 'La Belle Aurore', cursive; }

            /* PART 2: Increased Polaroid Size (Original 250px -> 375px) */
            .polaroid {
                background: white;
                padding: 18px 18px 36px;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
                border-radius: 4px;
                width: 375px; /* 50% increase from 250px */
                cursor: grab;
                user-select: none;
                touch-action: none;
                position: absolute;
            }
            .polaroid-transition {
                transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            }
            .polaroid img { width: 100%; aspect-ratio: 1/1; object-fit: cover; pointer-events: none; }

            /* PART 3: Increased Letter Box Size */
            .invitation-box {
                background: white;
                border-radius: 50px;
                padding: 60px;
                box-shadow: 0 30px 60px rgba(0,0,0,0.15);
                max-width: 95%;
                width: 650px; /* Increased width */
                min-height: 400px; /* Increased height */
                text-align: center;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            .heart-particle {
                position: absolute; font-size: 24px; pointer-events: none; z-index: 100;
                animation: floatUp 0.8s ease-out forwards;
            }
            @keyframes floatUp {
                from { transform: translateY(0) scale(1); opacity: 1; }
                to { transform: translateY(-100px) scale(1.5); opacity: 0; }
            }
        </style>
    </head>

    <body class="bg-custom-pink overflow-hidden w-full h-screen">

        <div id="dialogueScreen" class="fixed inset-0 flex items-center justify-center z-[100] transition-opacity duration-1000">
            <p id="dialogueText" class="romantic-font text-custom-red text-6xl md:text-8xl font-bold opacity-0 transition-opacity duration-[1500ms] text-center px-4"></p>
        </div>

        <div id="polaroidStack" class="fixed inset-0 flex items-center justify-center opacity-0 z-40 pointer-events-none transition-opacity duration-1000">
            <div class="relative w-[400px] h-[500px] flex items-center justify-center">
                <div class="polaroid swipeable rotate-[4deg] z-[10]">
                    <img src="./images/5.JPEG" /><p class="romantic-font text-center mt-3 text-gray-700 text-2xl">ror 🦖</p>
                </div>
                <div class="polaroid swipeable rotate-[-6deg] z-[20]">
                    <img src="./images/4.JPEG" /><p class="romantic-font text-center mt-3 text-gray-700 text-2xl">bleh 😛😛</p>
                </div>
                <div class="polaroid swipeable rotate-[9deg] z-[30]">
                    <img src="./images/3.JPEG" /><p class="romantic-font text-center mt-3 text-gray-700 text-2xl">funny 😭</p>
                </div>
                <div class="polaroid swipeable rotate-[-11deg] z-[40]">
                    <img src="./images/2.jpg" /><p class="romantic-font text-center mt-3 text-gray-700 text-2xl">goofy ahhh</p>
                </div>
                <div class="polaroid swipeable rotate-[6deg] z-[50]">
                    <img src="./images/1.JPEG" /><p class="romantic-font text-center mt-3 text-gray-700 text-2xl">what u lookin at</p>
                </div>
            </div>
        </div>

        <div id="finalSection" class="fixed inset-0 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-1000 z-50">
            <div class="invitation-box">
                <h2 class="romantic-font text-custom-red text-6xl md:text-7xl mb-10 font-bold leading-tight text-center">
                    <span class="block">will you be my</span>
                    <span class="block font-extrabold">Valentine?</span>
                </h2>
                
                <div class="flex flex-col sm:flex-row gap-10 w-full justify-center items-center mt-6">
                    <button id="yesButton" onclick="handleYes()" class="bg-custom-red text-white px-16 py-4 rounded-full text-4xl romantic-font shadow-xl hover:scale-110 transition-transform active:scale-95 z-[60]">
                        Yes!
                    </button>

                    <button id="noButton" onmouseover="moveNoButton()" onclick="moveNoButton()" class="border-4 border-custom-red text-custom-red px-16 py-4 rounded-full text-4xl romantic-font transition-all duration-200 z-[60]">
                        No
                    </button>
                </div>

                <div id="successMessage" class="mt-10 opacity-0 transition-opacity duration-1000">
                    <p class="romantic-font text-custom-red text-5xl">Yay! See you then! 💖</p>
                </div>
            </div>
        </div>

        <script>
            let index = 0;
            const lines = [
                "to my baby, my everything-",
                "atheena-"
            ];
            let cardsLeft = document.querySelectorAll(".swipeable").length;

            /* --- DIALOGUE --- */
            function showLine() {
                const text = document.getElementById("dialogueText");
                const screen = document.getElementById("dialogueScreen");

                if (index >= lines.length) {
                    screen.classList.add("opacity-0");
                    setTimeout(() => {
                        screen.classList.add("hidden");
                        startPart2();
                    }, 1000);
                    return;
                }

                text.textContent = lines[index];
                text.classList.remove("opacity-0");
                text.classList.add("opacity-100");

                setTimeout(() => {
                    text.classList.remove("opacity-100");
                    text.classList.add("opacity-0");
                    index++;
                    setTimeout(showLine, 1000);
                }, 3000);
            }

            function startPart2() {
                const stack = document.getElementById("polaroidStack");
                stack.classList.remove("opacity-0", "pointer-events-none");
                stack.classList.add("opacity-100");
            }

            window.onload = () => setTimeout(showLine, 1000);

            /* --- SWIPE LOGIC --- */
            let activeCard = null, startX = 0, startY = 0, currentX = 0, currentY = 0;

            document.querySelectorAll(".swipeable").forEach(card => {
                card.addEventListener("pointerdown", e => {
                    activeCard = e.currentTarget;
                    activeCard.classList.remove("polaroid-transition");
                    startX = e.clientX; startY = e.clientY;
                    activeCard.setPointerCapture(e.pointerId);
                });
            });

            window.addEventListener("pointermove", e => {
                if (!activeCard) return;
                currentX = e.clientX - startX;
                currentY = e.clientY - startY;
                activeCard.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${currentX * 0.1}deg)`;
                if (Math.random() > 0.9) spawnHeart(e.clientX, e.clientY);
            });

            window.addEventListener("pointerup", e => {
                if (!activeCard) return;
                activeCard.releasePointerCapture(e.pointerId);
                activeCard.classList.add("polaroid-transition");

                if (Math.abs(currentX) > 150) {
                    const dir = currentX > 0 ? 1 : -1;
                    activeCard.style.transform = `translate(${dir * 1200}px, ${currentY}px) rotate(${dir * 60}deg)`;
                    activeCard.style.opacity = "0";
                    const toRemove = activeCard;
                    setTimeout(() => { 
                        toRemove.remove(); 
                        cardsLeft--;
                        if (cardsLeft === 0) startPart3();
                    }, 500);
                } else { activeCard.style.transform = ""; }
                activeCard = null; currentX = 0; currentY = 0;
            });

            /* --- FINAL SECTION --- */
            function startPart3() {
                // Ensure everything else is gone and clickable
                document.getElementById("polaroidStack").classList.add("hidden");
                const section = document.getElementById("finalSection");
                section.classList.remove("pointer-events-none");
                section.classList.add("opacity-100");
            }

            function moveNoButton() {
                const btn = document.getElementById("noButton");
                btn.style.position = "fixed";
                const newX = Math.random() * (window.innerWidth - btn.offsetWidth);
                const newY = Math.random() * (window.innerHeight - btn.offsetHeight);
                btn.style.left = newX + "px";
                btn.style.top = newY + "px";
            }

            function handleYes() {
                document.getElementById("successMessage").classList.replace("opacity-0", "opacity-100");
                document.getElementById("noButton").classList.add("hidden");
                for(let i=0; i<50; i++) {
                    setTimeout(() => spawnHeart(Math.random()*window.innerWidth, Math.random()*window.innerHeight), i*50);
                }
            }

            function spawnHeart(x, y) {
                const heart = document.createElement("div");
                heart.className = "heart-particle";
                heart.textContent = "💖";
                heart.style.left = x + "px"; heart.style.top = y + "px";
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 800);
            }
        </script>
    </body>
</html>
