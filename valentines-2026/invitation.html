<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Valentine 💖</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black overflow-hidden">

  <!-- Dialogue Screen -->
  <div
    id="dialogueScreen"
    class="fixed inset-0 flex items-center justify-center"
  >
    <p
      id="dialogueText"
      class="text-pink-400 text-3xl md:text-4xl font-semibold tracking-wide opacity-0 transition-opacity duration-1000"
    >
      <!-- Text injected by JS -->
    </p>
  </div>

  <script>
    const lines = [
      "Hey baby",
      "I love you",
      "Be my Valentine 💖"
    ];

    const dialogueText = document.getElementById("dialogueText");
    let index = 0;

    function showLine() {
      if (index >= lines.length) {
        // END OF PART 1
        // Later we will transition to the polaroid section
        return;
      }

      dialogueText.textContent = lines[index];
      dialogueText.classList.remove("opacity-0");
      dialogueText.classList.add("opacity-100");

      // Stay visible
      setTimeout(() => {
        dialogueText.classList.remove("opacity-100");
        dialogueText.classList.add("opacity-0");

        index++;
        setTimeout(showLine, 1000); // wait before next line
      }, 2000);
    }

    // Start after page loads
    window.onload = () => {
      setTimeout(showLine, 500);
    };
  </script>

</body>
</html>
