<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Valentine 💖</title>

        <link href="https://fonts.googleapis.com/css2?family=La+Belle+Aurore&display=swap" rel="stylesheet">
        <script src="https://cdn.tailwindcss.com"></script>
        
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            'custom-pink': '#edc4c8',
                            'custom-red': '#ba2332',
                        },
                    },
                },
            }
        </script>

        <style>
            .romantic-font { font-family: 'La Belle Aurore', cursive; }

            /* Part 2: Polaroid Styles */
            .polaroid {
                background: white;
                padding: 12px 12px 24px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
                border-radius: 4px;
                width: 250px;
                cursor: grab;
                user-select: none;
                touch-action: none;
                position: absolute;
            }
            .polaroid-transition {
                transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            }
            .polaroid img { width: 100%; aspect-ratio: 1/1; object-fit: cover; pointer-events: none; }

            /* Part 3: The White Box (Letter) */
            .invitation-box {
                background: white;
                border-radius: 40px; /* Curved borders */
                padding: 40px;
                box-shadow: 0 20px 50px rgba(0,0,0,0.1);
                max-width: 90%;
                width: 450px;
                text-align: center;
            }

            .heart-particle {
                position: absolute; font-size: 24px; pointer-events: none; z-index: 100;
                animation: floatUp 0.8s ease-out forwards;
            }
            @keyframes floatUp {
                from { transform: translateY(0) scale(1); opacity: 1; }
                to { transform: translateY(-100px) scale(1.5); opacity: 0; }
            }
        </style>
    </head>

    <body class="bg-custom-pink overflow-hidden w-full h-screen">

        <div id="dialogueScreen" class="fixed inset-0 flex items-center justify-center z-[100] transition-opacity duration-1000">
            <p id="dialogueText" class="romantic-font text-custom-red text-6xl md:text-8xl font-bold opacity-0 transition-opacity duration-[1500ms] text-center px-4"></p>
        </div>

        <div id="polaroidStack" class="fixed inset-0 flex items-center justify-center opacity-0 z-40 pointer-events-none transition-opacity duration-1000">
            <div class="relative w-[300px] h-[400px] flex items-center justify-center">
                <div class="polaroid swipeable rotate-[3deg] z-[10]">
                    <img src="https://picsum.photos/300?random=1" /><p class="romantic-font text-center mt-2 text-gray-700 text-lg">Our first memory 💕</p>
                </div>
                <div class="polaroid swipeable rotate-[-5deg] z-[20]">
                    <img src="https://picsum.photos/300?random=2" /><p class="romantic-font text-center mt-2 text-gray-700 text-lg">Endless laughs</p>
                </div>
                <div class="polaroid swipeable rotate-[8deg] z-[30]">
                    <img src="https://picsum.photos/300?random=3" /><p class="romantic-font text-center mt-2 text-gray-700 text-lg">Late night talks 🌙</p>
                </div>
                <div class="polaroid swipeable rotate-[-10deg] z-[40]">
                    <img src="https://picsum.photos/300?random=4" /><p class="romantic-font text-center mt-2 text-gray-700 text-lg">Stolen moments</p>
                </div>
                <div class="polaroid swipeable rotate-[5deg] z-[50]">
                    <img src="https://picsum.photos/300?random=5" /><p class="romantic-font text-center mt-2 text-gray-700 text-lg">Just us 💖</p>
                </div>
                <div class="polaroid swipeable rotate-[-2deg] z-[60]">
                    <img src="https://picsum.photos/300?random=6" /><p class="romantic-font text-center mt-2 text-gray-700 text-lg">Forever vibes</p>
                </div>
            </div>
        </div>

        <div id="finalSection" class="fixed inset-0 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-1000 z-30">
            <div class="invitation-box flex flex-col items-center">
                <h2 class="romantic-font text-custom-red text-5xl md:text-6xl mb-8 font-bold leading-tight">
                    Will you be my Valentine?
                </h2>
                
                <div class="flex flex-col sm:flex-row gap-6 w-full justify-center items-center mt-4">
                    <button onclick="handleYes()" class="bg-custom-red text-white px-12 py-3 rounded-full text-3xl romantic-font shadow-lg hover:scale-110 transition-transform active:scale-95">
                        Yes!
                    </button>

                    <button id="noButton" onmouseover="moveNoButton()" onclick="moveNoButton()" class="border-2 border-custom-red text-custom-red px-12 py-3 rounded-full text-3xl romantic-font transition-all duration-200">
                        No
                    </button>
                </div>

                <div id="successMessage" class="mt-8 opacity-0 transition-opacity duration-1000">
                    <p class="romantic-font text-custom-red text-4xl">Yay! See you on the 14th! 💖</p>
                </div>
            </div>
        </div>

        <script>
            let index = 0;
            const lines = ["hey baby", "i love you", "be my Valentine 💖"];
            let cardsLeft = document.querySelectorAll(".swipeable").length;

            /* --- PART 1: DIALOGUE --- */
            function showLine() {
                const text = document.getElementById("dialogueText");
                const screen = document.getElementById("dialogueScreen");

                if (index >= lines.length) {
                    screen.classList.add("opacity-0");
                    setTimeout(() => {
                        screen.classList.add("hidden");
                        startPart2();
                    }, 1000);
                    return;
                }

                text.textContent = lines[index];
                text.classList.remove("opacity-0");
                text.classList.add("opacity-100");

                setTimeout(() => {
                    text.classList.remove("opacity-100");
                    text.classList.add("opacity-0");
                    index++;
                    setTimeout(showLine, 1000);
                }, 3000);
            }

            function startPart2() {
                const stack = document.getElementById("polaroidStack");
                stack.classList.remove("opacity-0", "pointer-events-none");
                stack.classList.add("opacity-100");
            }

            window.onload = () => setTimeout(showLine, 1000);

            /* --- PART 2: SWIPE LOGIC --- */
            let activeCard = null, startX = 0, startY = 0, currentX = 0, currentY = 0;

            document.querySelectorAll(".swipeable").forEach(card => {
                card.addEventListener("pointerdown", e => {
                    activeCard = e.currentTarget;
                    activeCard.classList.remove("polaroid-transition");
                    startX = e.clientX; startY = e.clientY;
                    activeCard.setPointerCapture(e.pointerId);
                });
            });

            window.addEventListener("pointermove", e => {
                if (!activeCard) return;
                currentX = e.clientX - startX;
                currentY = e.clientY - startY;
                activeCard.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${currentX * 0.1}deg)`;
                if (Math.random() > 0.9) spawnHeart(e.clientX, e.clientY);
            });

            window.addEventListener("pointerup", e => {
                if (!activeCard) return;
                activeCard.releasePointerCapture(e.pointerId);
                activeCard.classList.add("polaroid-transition");

                if (Math.abs(currentX) > 130) {
                    const dir = currentX > 0 ? 1 : -1;
                    activeCard.style.transform = `translate(${dir * 1000}px, ${currentY}px) rotate(${dir * 45}deg)`;
                    activeCard.style.opacity = "0";
                    const toRemove = activeCard;
                    setTimeout(() => { 
                        toRemove.remove(); 
                        cardsLeft--;
                        if (cardsLeft === 0) startPart3();
                    }, 500);
                } else { activeCard.style.transform = ""; }
                activeCard = null; currentX = 0; currentY = 0;
            });

            /* --- PART 3: FINAL BOX --- */
            function startPart3() {
                document.getElementById("polaroidStack").classList.add("opacity-0");
                setTimeout(() => {
                    const section = document.getElementById("finalSection");
                    section.classList.remove("pointer-events-none");
                    section.classList.add("opacity-100");
                }, 1000);
            }

            function moveNoButton() {
                const btn = document.getElementById("noButton");
                // By setting position to fixed, it ignores the white box boundaries
                btn.style.position = "fixed";
                
                // Calculate random position on the entire screen
                const newX = Math.random() * (window.innerWidth - btn.offsetWidth);
                const newY = Math.random() * (window.innerHeight - btn.offsetHeight);
                
                btn.style.left = newX + "px";
                btn.style.top = newY + "px";
                btn.style.zIndex = "1000"; // Ensure it stays on top of everything
            }

            function handleYes() {
                document.getElementById("successMessage").classList.replace("opacity-0", "opacity-100");
                document.getElementById("noButton").style.display = "none";
                for(let i=0; i<40; i++) {
                    setTimeout(() => spawnHeart(Math.random()*window.innerWidth, Math.random()*window.innerHeight), i*50);
                }
            }

            function spawnHeart(x, y) {
                const heart = document.createElement("div");
                heart.className = "heart-particle";
                heart.textContent = "💖";
                heart.style.left = x + "px"; heart.style.top = y + "px";
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 800);
            }
        </script>
    </body>
</html>
