<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Invitation</title>

        <link href="https://fonts.googleapis.com/css2?family=La+Belle+Aurore&display=swap" rel="stylesheet">

        <script src="https://cdn.tailwindcss.com"></script>
        
        <script>
            // 1. Implementing your custom colors into the Tailwind Config
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            'custom-pink': '#edc4c8',
                            'custom-red': '#ba2332',
                        },
                    },
                },
            }
        </script>

        <style>
            .romantic-font {
                font-family: 'La Belle Aurore', cursive;
            }

            .polaroid {
                background: white;
                padding: 12px 12px 24px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
                border-radius: 4px;
                width: 240px;
                cursor: grab;
                user-select: none;
                touch-action: none;
            }

            .polaroid-transition {
                transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            }

            .polaroid:active {
                cursor: grabbing;
            }

            .polaroid img {
                width: 100%;
                aspect-ratio: 1 / 1;
                object-fit: cover;
                pointer-events: none;
            }

            .heart {
                position: absolute;
                font-size: 20px;
                pointer-events: none;
                z-index: 50;
                animation: floatUp 0.8s ease-out forwards;
            }

            @keyframes floatUp {
                from {
                    transform: translateY(0) scale(1) rotate(0deg);
                    opacity: 1;
                }
                to {
                    transform: translateY(-100px) scale(1.5) rotate(20deg);
                    opacity: 0;
                }
            }
        </style>
    </head>

    <body class="bg-custom-pink overflow-hidden">

        <div id="dialogueScreen" class="fixed inset-0 flex items-center justify-center z-20">
            <p
                id="dialogueText"
                /* 3. Applied 'text-custom-red' here */
                class="romantic-font text-custom-red text-7xl font-bold
                        opacity-0 transition-opacity duration-[1500ms]
                        text-center drop-shadow-md"
            >
            </p>
        </div>

        <div
            id="polaroidStack"
            class="fixed inset-0 flex items-center justify-center opacity-0 transition-opacity duration-[2000ms] z-10"
        >
            <div class="relative w-[300px] h-[400px] flex items-center justify-center">

                <div class="polaroid swipeable absolute rotate-[3deg] z-[1]">
                    <img src="https://picsum.photos/300?random=6" />
                    <p class="romantic-font text-center mt-2 text-gray-700 text-lg">Forever vibes</p>
                </div>

                <div class="polaroid swipeable absolute rotate-[-12deg] z-[2]">
                    <img src="https://picsum.photos/300?random=5" />
                    <p class="romantic-font text-center mt-2 text-gray-700 text-lg">Just us 💖</p>
                </div>

                <div class="polaroid swipeable absolute rotate-[10deg] z-[3]">
                    <img src="https://picsum.photos/300?random=4" />
                    <p class="romantic-font text-center mt-2 text-gray-700 text-lg">Stolen moments</p>
                </div>

                <div class="polaroid swipeable absolute rotate-[-2deg] z-[4]">
                    <img src="https://picsum.photos/300?random=3" />
                    <p class="romantic-font text-center mt-2 text-gray-700 text-lg">Late night talks 🌙</p>
                </div>

                <div class="polaroid swipeable absolute rotate-[5deg] z-[5]">
                    <img src="https://picsum.photos/300?random=2" />
                    <p class="romantic-font text-center mt-2 text-gray-700 text-lg">Endless laughs</p>
                </div>

                <div class="polaroid swipeable absolute rotate-[-8deg] z-[6]">
                    <img src="https://picsum.photos/300?random=1" />
                    <p class="romantic-font text-center mt-2 text-gray-700 text-lg">Our first memory 💕</p>
                </div>

            </div>
        </div>

        <script>
            /* PART 1 LOGIC */
            const lines = ["hey baby", "i love you", "be my valentine 💖"];
            const dialogueText = document.getElementById("dialogueText");
            const dialogueScreen = document.getElementById("dialogueScreen");
            const polaroidStack = document.getElementById("polaroidStack");
            let index = 0;

            function showLine() {
                if (index >= lines.length) {
                    dialogueScreen.classList.add("pointer-events-none");
                    dialogueScreen.style.opacity = "0";
                    setTimeout(() => {
                        polaroidStack.classList.remove("opacity-0");
                        polaroidStack.classList.add("opacity-100");
                    }, 1000);
                    return;
                }

                dialogueText.textContent = lines[index];
                dialogueText.classList.remove("opacity-0");
                dialogueText.classList.add("opacity-100");

                setTimeout(() => {
                    dialogueText.classList.remove("opacity-100");
                    dialogueText.classList.add("opacity-0");
                    index++;
                    setTimeout(showLine, 1000);
                }, 3000);
            }

            window.onload = () => setTimeout(showLine, 1000);

            /* SWIPE LOGIC */
            const polaroids = document.querySelectorAll(".swipeable");
            let activeCard = null, startX = 0, startY = 0, currentX = 0, currentY = 0, heartTimer = 0;

            polaroids.forEach(card => card.addEventListener("pointerdown", startSwipe));

            function startSwipe(e) {
                activeCard = e.currentTarget;
                activeCard.classList.remove("polaroid-transition");
                startX = e.clientX; startY = e.clientY;
                activeCard.setPointerCapture(e.pointerId);
                activeCard.addEventListener("pointermove", onSwipe);
                activeCard.addEventListener("pointerup", endSwipe);
                spawnHeart(e.clientX, e.clientY);
            }

            function onSwipe(e) {
                if (!activeCard) return;
                currentX = e.clientX - startX;
                currentY = e.clientY - startY;
                activeCard.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${currentX * 0.1}deg)`;
                if (++heartTimer % 5 === 0) spawnHeart(e.clientX, e.clientY);
            }

            function endSwipe(e) {
                if (!activeCard) return;
                activeCard.releasePointerCapture(e.pointerId);
                activeCard.removeEventListener("pointermove", onSwipe);
                activeCard.removeEventListener("pointerup", endSwipe);
                activeCard.classList.add("polaroid-transition");

                if (Math.abs(currentX) > 150) {
                    const direction = currentX > 0 ? 1 : -1;
                    activeCard.style.transform = `translate(${direction * 1000}px, ${currentY}px) rotate(${direction * 45}deg)`;
                    activeCard.style.opacity = "0";
                    const cardToRemove = activeCard;
                    setTimeout(() => cardToRemove.remove(), 500);
                } else {
                    activeCard.style.transform = "";
                }
                activeCard = null; currentX = 0; currentY = 0;
            }

            function spawnHeart(x, y) {
                const heart = document.createElement("div");
                heart.className = "heart";
                heart.textContent = ["💖", "💗", "❤️", "💕"][Math.floor(Math.random() * 4)];
                heart.style.left = (x - 10) + "px"; heart.style.top = (y - 10) + "px";
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 800);
            }
        </script>
    </body>
</html>
